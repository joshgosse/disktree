[package]
name = "disktree-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Filesystem scanning and treemap layout for disktree"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rayon = { workspace = true }
rustc-hash = { workspace = true }

# rustix has no filesystem calls on Windows; `windows.rs` covers them there.
[target.'cfg(not(windows))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# The Recycle Bin, through the shell's own file operation.
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
winapi-util = "0.1.11"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# The system trash, through NSFileManager: what Finder's Move to Trash does,
# without asking to control Finder. Only this backend is used; the crate's
# Linux and Windows code is not built.
[target.'cfg(target_os = "macos")'.dependencies]
trash = { version = "5.2.9", default-features = false }
# A volume's name and purgeable space, which only Foundation reports; see
# `macos.rs`. The versions `trash` already builds on.
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSString",
    "NSURL",
    "NSValue",
] }

[dev-dependencies]
tempfile = "3"
